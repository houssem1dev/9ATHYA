<!DOCTYPE html>
<html lang="ar-TN" dir="rtl">
<head>
    <meta name="google-site-verification" content="V5LLdebyhqCA_4S5c4uCnhruAYzKGMaPH15uWKT6NPQ" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9ATHYA.TN | خدمة توصيل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>🔥 9ATHYA.TN</h1>
            <p>خدمة توصيل المنتجات</p>
        </div>

        <!-- TABS -->
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-cat="all">📋 الكل</button>
            <button class="tab-btn" data-cat="vegetables">🥬 خضرة</button>
            <button class="tab-btn" data-cat="fruits">🍎 غلة</button>
            <button class="tab-btn" data-cat="staples">🌾 أساسيات</button>
            <button class="tab-btn" data-cat="meat">🥩 بروتينات</button>
            <button class="tab-btn" data-cat="dairy">🥛 ألبان</button>
            <button class="tab-btn" data-cat="grains">🫘 بقول</button>
            <button class="tab-btn" data-cat="conserves">🥫 معلبات</button>
        </div>

        <!-- PRODUCTS -->
        <div id="productsContainer"></div>

        <!-- CART -->
        <div class="cart">
            <h2>🛒 السلة <span id="cartCount">0</span></h2>
            <ul class="cart-items" id="cartList">
                <li style="text-align:center;color:#999;padding:15px;">السلة فارغة</li>
            </ul>
            <div class="total">المجموع: <span id="totalPrice">0.000</span> DT</div>
            <button id="orderBtn">📨 تأكيد الطلب</button>
        </div>
    </div>

    <!-- ====== JAVASCRIPT ====== -->
    <script src="script.js"></script>

</body>
</html>
